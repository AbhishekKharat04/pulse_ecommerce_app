name: pulse_ecommerce_app
description: "A production-grade Flutter E-Commerce Application showcasing Clean Architecture, BLoC State Management, REST API with caching, and FCM Push Notifications."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Networking & Caching
  http: ^1.2.0
  shared_preferences: ^2.2.2

  # Dependency Injection
  get_it: ^7.6.0

  # UI & Styling
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
